# Multi-word filler that compresses to a single plain word. Substitution rule
# so the suggested replacement ships with the alert. "in order to" and
# "a number of" moved here from FillerVerbs so the fix travels with the flag.
extends: substitution
message: "Prefer '%s' over '%s'."
level: warning
ignorecase: true
action:
  name: replace
swap:
  in order to: to
  due to the fact that: because
  at this point in time: now
  in the event that: if
  has the ability to: can
  a number of: several
  prior to: before
  subsequent to: after
  in the near future: soon
