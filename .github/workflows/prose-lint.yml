name: Prose lint (changed docs)

# Lints prose in changed Markdown / MDX with Vale through the official
# vale-cli/vale-action. Violations annotate the PR but the check never
# fails the build. To enforce, flip fail_on_error to true.

on:
  pull_request:
    paths:
      - "**/*.md"
      - "**/*.mdx"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vale:
    name: Lint changed docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint prose with Vale
        # Keep advisory annotation delivery from blocking on API outages.
        continue-on-error: true
        uses: vale-cli/vale-action@518a9136acc6e6668ce7c00d367051e0941e87ff # v3.0.0
        with:
          version: "3.14.2"
          min_alert_level: error
          files: all
          filter_mode: added
          fail_on_error: false
          reporter: github-pr-review
